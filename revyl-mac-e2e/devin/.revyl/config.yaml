# Staging Mac proof fixture for #7295 (devin harness). Throwaway; removed after the run.
project:
  id: "5e83f578-102a-42c3-adcb-b4c78bc2c417"
session:
  default_profile: mac-start
  profiles:
    mac-start:
      script: scripts/mac-start.sh
    mac-extra:
      script: scripts/mac-extra.sh
pr_review:
  enabled: true
  proof_of_changes:
    enabled: true
    harness:
      kind: devin
    always_verify:
      - "Run the session profile mac-extra on the Mac once, then use revyl computer exec to print ~/rev4769-extra.txt and confirm it contains REV4769_EXTRA_OK."
      - "Use revyl computer exec to print ~/rev4769-start.txt and confirm it contains REV4769_START_OK, which the starting profile wrote."
      - "Take one screenshot of the Mac's screen and publish it into the proof write-up, following the Mac evidence steps in your instructions."
    macos:
      app_id: "43f66538-0caf-4cf0-9aa6-767fc9781829"
      session_profile: mac-start
